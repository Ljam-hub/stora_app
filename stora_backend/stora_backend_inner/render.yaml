# Render Blueprint — deploy from the repo in one click.
# https://render.com/docs/blueprint-spec

databases:
  - name: stora-db
    plan: free
    databaseName: stora
    user: stora

services:
  - type: web
    name: stora-backend
    runtime: python
    plan: free
    buildCommand: "cd stora_backend/stora_backend_inner && ./build.sh"
    startCommand: "cd stora_backend/stora_backend_inner && chmod +x start.sh && ./start.sh"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "osiallj@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        value: "kworofuerbnejybp"
      - key: DEFAULT_FROM_EMAIL
        value: "STORA <osiallj@gmail.com>"
      # Set these manually in the Render dashboard:
      # - DATABASE_URL              (your Supabase connection string)
      # - CLOUDINARY_URL            (from your Cloudinary account)
      # - FIREBASE_CREDENTIALS_JSON (minified service account JSON for FCM push notifications)
      # - BREVO_API_KEY             (Free API key from brevo.com to send emails over HTTPS Port 443 — bypasses Render Free SMTP block)
      # - RESEND_API_KEY            (Alternative API key from resend.com)
      # - CORS_ALLOWED_ORIGINS      (if Flutter web is used)
